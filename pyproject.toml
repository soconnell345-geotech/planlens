[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "planlens"
version = "0.1.0"
description = "Drawing & submittal intelligence — deterministic geometry extraction and confidence-scored annotation constructs (leaders, dimensions, title blocks, bubbles, revision clouds) from PDF and DXF construction drawings"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "Sean O'Connell", email = "soconnell345@gmail.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=2.0",
    "ezdxf>=1.4",
    "PyMuPDF>=1.23",
]

[project.optional-dependencies]
# Raster/scanned-sheet ingest (OpenCV Hough/contour tracing).
raster = ["opencv-python-headless>=4.8"]
# OCR leg (planlens.ocr): RapidOCR, Apache-2.0, ~60 MB incl. onnxruntime;
# PP-OCR models ship in the wheel — no runtime downloads, no system
# binaries, no GPL. Needed for text on SHX-plotted and scanned sheets.
# NOTE: every rapidocr distribution hard-requires the full (GUI)
# opencv-python, which conflicts-in-namespace with [raster]'s headless
# build — pip cannot express "either variant". This extra is the
# batteries-included DESKTOP path; server/headless deploys (Databricks,
# TinyApps) should use the verified --no-deps recipe in README
# "Install" instead, which runs the whole OCR leg on headless alone.
ocr = ["rapidocr-onnxruntime>=1.2"]

[tool.setuptools.packages.find]
include = ["planlens*"]
exclude = ["*.tests", "*.tests.*"]

[tool.pytest.ini_options]
testpaths = ["planlens"]
