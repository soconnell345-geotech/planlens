[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "planlens"
version = "0.2.0"
description = "Review-ready data from AEC documents for LLMs: page maps, located text, tables, review markups and hidden CAD text from any PDF, plus deterministic drawing geometry and confidence-scored annotation constructs (leaders, dimensions, title blocks, callouts) from PDF and DXF sheets, with framework-neutral LLM tools"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "Sean O'Connell", email = "soconnell345@gmail.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=2.0",
    "ezdxf>=1.4",
    "PyMuPDF>=1.23",
]

[project.optional-dependencies]
# Raster/scanned-sheet ingest (OpenCV Hough/contour tracing).
#
# NO UPPER BOUND, and OpenCV 5 has already walked through the gap: a Databricks
# install on 2026-09-11 resolved 5.0.0.93 and nobody decided that -- it was
# found by reading an install log. VERIFIED SAFE: the full suite (792 passed /
# 1 skipped) was run against OpenCV 5.0.0, and the cv2 surface used here is
# small and long-stable (imdecode, cvtColor, Canny, HoughLinesP, HoughCircles,
# findContours, approxPolyDP, threshold, medianBlur, rotate); findContours is
# already unpacked version-agnostically in ir/raster.py. If you tighten this to
# ">=4.8,<6" so the NEXT major is a decision rather than a discovery, that is a
# deliberate release, not a drive-by. Triage guide: the app repo's
# docs/DATABRICKS_INSTALL.md section 7.
raster = ["opencv-python-headless>=4.8"]
# OCR leg (planlens.ocr): RapidOCR, Apache-2.0, ~60 MB incl. onnxruntime;
# PP-OCR models ship in the wheel — no runtime downloads, no system
# binaries, no GPL. Needed for text on SHX-plotted and scanned sheets.
# NOTE: every rapidocr distribution hard-requires the full (GUI)
# opencv-python, which conflicts-in-namespace with [raster]'s headless
# build — pip cannot express "either variant". This extra is the
# batteries-included DESKTOP path; server/headless deploys (Databricks,
# TinyApps) should use the verified --no-deps recipe in README
# "Install" instead, which runs the whole OCR leg on headless alone.
ocr = ["rapidocr-onnxruntime>=1.2,<1.3"]  # <1.3: the OCR corner-role-shift correction reads engine internals (text_cls); re-verify the role table before raising

[tool.setuptools.packages.find]
include = ["planlens*"]
exclude = ["*.tests", "*.tests.*"]

[tool.pytest.ini_options]
testpaths = ["planlens"]
